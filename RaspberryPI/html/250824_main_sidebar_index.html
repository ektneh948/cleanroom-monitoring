<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>클린룸 모니터링 프로젝트 · 대시보드</title>
  <style>
    :root {
      --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --sidebar-bg: #2d3748;
      --text: #2d3748;
      --text-light: #718096;
      --accent: #9f7aea;
      --accent-light: #e9d8fd;
      --success: #38a169;
      --warning: #ed8936;
      --error: #e53e3e;
      --border: rgba(255, 255, 255, 0.2);
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      --border-radius: 16px;
    }

    [data-theme="dark"] {
      --bg: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
      --card-bg: rgba(45, 55, 72, 0.9);
      --sidebar-bg: #1a202c;
      --text: #e2e8f0;
      --text-light: #a0aec0;
      --border: rgba(255, 255, 255, 0.1);
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 300px;
      /* ← 1fr 300px 에서 교체 */
      grid-template-areas: "main sidebar";
      /* ← 추가 */
      height: 100vh;
      gap: 20px;
      padding: 20px;
    }

    @media (max-width: 1024px) {
      .dashboard {
        grid-template-columns: 1fr;
        grid-template-areas:
          "main"
          "sidebar";
        /* ← 모바일/태블릿에서 사이드바가 위로 */
        gap: 15px;
      }
    }

    /* Main Content */
    .main-content {
      grid-area: main;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .header {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .header-top {
      display: flex;
      justify-content: between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(56, 161, 105, 0.4);
      }

      70% {
        box-shadow: 0 0 0 10px rgba(56, 161, 105, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(56, 161, 105, 0);
      }
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }

    .subtitle {
      color: var(--text-light);
      font-size: 14px;
      margin-top: 5px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn,
    .select-wrapper {
      background: var(--accent-light);
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      color: var(--accent);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 14px;
    }

    .btn:hover {
      background: var(--accent);
      color: white;
      transform: translateY(-2px);
    }

    .select-wrapper select {
      background: transparent;
      border: none;
      color: inherit;
      font: inherit;
      margin-left: 8px;
    }

    /* KPI Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .kpi-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      transition: transform 0.3s ease;
    }

    .kpi-card:hover {
      transform: translateY(-5px);
    }

    .kpi-label {
      color: var(--text-light);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
    }

    /* Main Charts */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .charts-grid {
        grid-template-columns: 1fr;
      }
    }

    .chart-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      overflow: hidden;
      min-height: 500px;
      transition: all 0.3s ease;
    }

    .chart-card:hover {
      transform: translateY(-5px);
    }

    .chart-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chart-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    .chart-actions {
      display: flex;
      gap: 8px;
    }

    .chart-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      color: var(--text-light);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .chart-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .chart-content {
      position: relative;
      height: 460px;
    }

    .chart-content iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }

    /* Sidebar */
    .sidebar {
      grid-area: sidebar;
      background: var(--sidebar-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }

    .sidebar-section {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 15px;
    }

    .sidebar-title {
      color: #e2e8f0;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .clock-display {
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, var(--accent), #667eea);
      border-radius: 12px;
      color: white;
    }

    .clock-time {
      font-size: 32px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
    }

    .clock-date {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 5px;
    }

    .status-list {
      list-style: none;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-item:last-child {
      border-bottom: none;
    }

    .status-label {
      color: #a0aec0;
      font-size: 14px;
    }

    .status-value {
      color: #e2e8f0;
      font-weight: 500;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      margin-left: 8px;
    }

    /* Fullscreen */
    .fullscreen {
      position: fixed;
      inset: 20px;
      z-index: 9999;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .fullscreen .chart-content {
      height: calc(100vh - 140px);
    }

    .fullscreen .chart-content iframe {
      height: 100%;
    }

    /* Loading Animation */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(159, 122, 234, 0.3);
      border-radius: 50%;
      border-top-color: var(--accent);
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Tags */
    .tag {
      display: inline-block;
      background: rgba(159, 122, 234, 0.2);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }
  </style>
</head>

<body>
  <div class="dashboard" id="app">
    <!-- Main Content -->
    <div class="main-content">
      <!-- Header -->
      <div class="header">
        <div class="header-top">
          <div class="logo">
            <div class="status-dot" title="연결됨"></div>
            <div>
              <div class="title">클린룸 모니터링 대시보드</div>
              <div class="subtitle">센서 테이블 & 실시간 그래프 · 서버 <span class="tag">10.10.14.62</span></div>
            </div>
          </div>
          <div class="controls">
            <div class="select-wrapper">
              <label>자동 새로고침
                <select id="autoEvery">
                  <option value="0">끄기</option>
                  <option value="15000">15초</option>
                  <option value="30000" selected>30초</option>
                  <option value="60000">60초</option>
                </select>
              </label>
            </div>
            <button class="btn" id="refreshAll">전체 새로고침</button>
            <button class="btn" id="themeBtn">테마 전환</button>
          </div>
        </div>

        <!-- KPI Cards -->
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">마지막 새로고침</div>
            <div class="kpi-value" id="lastRefresh">--:--:--</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">자동 새로고침</div>
            <div class="kpi-value" id="autoStatus">OFF</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">테마</div>
            <div class="kpi-value" id="themeName">Light</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">프레임 상태</div>
            <div class="kpi-value" id="frameState">OK</div>
          </div>
        </div>
      </div>

      <!-- Charts -->
      <div class="charts-grid">
        <!-- 센서 테이블 -->
        <div class="chart-card" id="cardTable">
          <div class="chart-header">
            <div class="chart-title">센서 테이블</div>
            <div class="chart-actions">
              <button class="chart-btn" data-action="reload" data-target="frameTable">새로고침</button>
              <button class="chart-btn" data-action="fullscreen" data-target="cardTable">전체화면</button>
            </div>
          </div>
          <div class="chart-content">
            <iframe id="frameTable" src="http://10.10.14.62/sensorTable.php" loading="lazy"
              referrerpolicy="no-referrer"></iframe>
          </div>
        </div>

        <!-- 실시간 그래프 -->
        <div class="chart-card" id="cardGraph">
          <div class="chart-header">
            <div class="chart-title">시간별 그래프</div>
            <div class="chart-actions">
              <button class="chart-btn" data-action="reload" data-target="frameGraph">새로고침</button>
              <button class="chart-btn" data-action="fullscreen" data-target="cardGraph">전체화면</button>
            </div>
          </div>
          <div class="chart-content">
            <iframe id="frameGraph" src="http://10.10.14.62/sensorGraph.php" loading="lazy"
              referrerpolicy="no-referrer"></iframe>
          </div>
        </div>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <!-- Clock -->
      <div class="sidebar-section">
        <div class="clock-display">
          <div class="clock-time" id="clock">--:--:--</div>
          <div class="clock-date" id="date">--</div>
        </div>
      </div>



      <!-- Recent Activity -->
      <div class="sidebar-section">
        <div class="sidebar-title">최근 활동</div>
        <ul class="status-list">
          <li class="status-item">
            <span class="status-label">센서 데이터 업데이트</span>
            <span class="status-value" id="sensorUpdate">방금 전</span>
          </li>
          <li class="status-item">
            <span class="status-label">그래프 새로고침</span>
            <span class="status-value" id="graphUpdate">방금 전</span>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    // --- 테마 관리 ---
    const root = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    const themeNameEl = document.getElementById('themeName');

    function setTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      localStorage.setItem('dash.theme', theme);
      themeNameEl.textContent = theme === 'light' ? 'Light' : 'Dark';
    }

    setTheme(localStorage.getItem('dash.theme') || 'light');
    themeBtn.addEventListener('click', () => {
      const currentTheme = document.body.getAttribute('data-theme');
      setTheme(currentTheme === 'light' ? 'dark' : 'light');
    });

    // --- 시계 및 날짜 ---
    function pad(n) { return n < 10 ? '0' + n : n; }

    function updateClock() {
      const now = new Date();
      const timeStr = [pad(now.getHours()), pad(now.getMinutes()), pad(now.getSeconds())].join(':');
      const dateStr = now.toLocaleDateString('ko-KR', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      document.getElementById('clock').textContent = timeStr;
      document.getElementById('date').textContent = dateStr;
    }

    setInterval(updateClock, 1000);
    updateClock();

    // --- 새로고침 로직 ---
    const frameTable = document.getElementById('frameTable');
    const frameGraph = document.getElementById('frameGraph');

    function reloadFrame(frameId) {
      const frame = document.getElementById(frameId);
      if (!frame) return;

      const url = new URL(frame.src);
      url.searchParams.set('_t', Date.now());
      frame.src = url.toString();

      // 활동 업데이트
      updateActivity(frameId);
    }

    function refreshAll() {
      reloadFrame('frameTable');
      reloadFrame('frameGraph');

      const now = new Date();
      const timeStr = [pad(now.getHours()), pad(now.getMinutes()), pad(now.getSeconds())].join(':');
      document.getElementById('lastRefresh').textContent = timeStr;
    }

    function updateActivity(frameId) {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('ko-KR');

      if (frameId === 'frameTable') {
        document.getElementById('sensorUpdate').textContent = timeStr;
      } else if (frameId === 'frameGraph') {
        document.getElementById('graphUpdate').textContent = timeStr;
      }
    }

    // --- 이벤트 리스너 ---
    document.getElementById('refreshAll').addEventListener('click', refreshAll);

    document.querySelectorAll('button[data-action="reload"]').forEach(btn => {
      btn.addEventListener('click', () => {
        reloadFrame(btn.dataset.target);
      });
    });

    // --- 전체화면 기능 ---
    document.querySelectorAll('button[data-action="fullscreen"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const card = document.getElementById(btn.dataset.target);
        card.classList.toggle('fullscreen');
      });
    });

    // ESC 키로 전체화면 해제
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.fullscreen').forEach(el => {
          el.classList.remove('fullscreen');
        });
      }
    });

    // --- 자동 새로고침 ---
    const autoSelect = document.getElementById('autoEvery');
    const autoStatusEl = document.getElementById('autoStatus');
    let autoTimer = null;

    function setAutoRefresh(ms) {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
      }

      if (ms && ms > 0) {
        autoTimer = setInterval(refreshAll, ms);
        autoStatusEl.textContent = (ms / 1000) + 's';
      } else {
        autoStatusEl.textContent = 'OFF';
      }

      localStorage.setItem('dash.auto', String(ms || 0));
    }

    autoSelect.value = localStorage.getItem('dash.auto') || '30000';
    setAutoRefresh(parseInt(autoSelect.value, 10));

    autoSelect.addEventListener('change', () => {
      setAutoRefresh(parseInt(autoSelect.value, 10));
    });

    // --- 프레임 상태 모니터링 ---
    function monitorFrame(frame, name) {
      let isLoading = true;
      const timeout = setTimeout(() => {
        if (isLoading) {
          document.getElementById('frameState').textContent = '시간초과';
        }
      }, 8000);

      frame.addEventListener('load', () => {
        clearTimeout(timeout);
        isLoading = false;
        document.getElementById('frameState').textContent = 'OK';
      });

      frame.addEventListener('error', () => {
        clearTimeout(timeout);
        isLoading = false;
        document.getElementById('frameState').textContent = '오류';
      });
    }

    monitorFrame(frameTable, 'table');
    monitorFrame(frameGraph, 'graph');

    // 초기 로드
    refreshAll();
  </script>
</body>

</html>
